# Example scenario schedule: one episode per attack family (E1-06).
# Format only. The corpus schedule is generated by E2-03. Device IDs are the placeholders of
# thesis/schema/devices.py until the device inventory (E5-01) replaces them.
# Offsets and durations are whole seconds; each range is [start, start + duration).

episodes:
  - id: ep-001
    family: ssh_brute_force
    target_device: hp-ssh-01
    start_offset_s: 300
    duration_s: 240
    parameters: {}
    seed: 1
  - id: ep-002
    family: port_scan
    target_device: hp-ssh-01
    start_offset_s: 540  # touches ep-001 end to start: adjacent, not overlapping
    duration_s: 120
    parameters: {}
    seed: 2
  - id: ep-003
    family: mqtt_publish_flood
    target_device: iot-temp-01
    start_offset_s: 300  # same time as ep-001, on another device: allowed
    duration_s: 180
    parameters: {}
    seed: 3
  - id: ep-004
    family: mqtt_brute_force
    target_device: iot-temp-01
    start_offset_s: 900
    duration_s: 240
    parameters: {}
    seed: 4
  - id: ep-005
    family: syn_flood
    target_device: iot-cam-01
    start_offset_s: 600
    duration_s: 120
    parameters: {}
    seed: 5
  - id: ep-006
    family: botnet
    target_device: iot-cam-01
    start_offset_s: 1200
    duration_s: 300
    parameters: {}
    seed: 6

benign_periods:
  - id: bn-001
    start_offset_s: 0
    duration_s: 300
