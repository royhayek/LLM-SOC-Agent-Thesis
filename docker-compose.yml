# Benign-only IoT testbed (ticket E0-07, record §4, §6.2, §6.11, ADR-0002).
# Start and stop it with `make up` / `make down`, which set RUN_DIR to data/raw/<run_id>.
# Without RUN_DIR (plain `docker compose ps` and similar) it falls back to data/raw/_no_run.
# No service publishes a port, and the only network is internal: nothing here can
# reach the host LAN or the internet. scripts/check_isolation.sh verifies that.

name: thesis-testbed

# Capture sidecar settings shared by every capture-* service (ADR-0008, ADR-0009). Each one
# builds the same image, so `docker compose up --build` never tries to pull it.
# No restart: a restarted tcpdump would overwrite its pcap. `make down` fails instead.
x-capture: &capture
  build: ./testbed/capture
  image: thesis-testbed-capture:e1-16
  cap_add: [NET_ADMIN, NET_RAW]
  volumes:
    - ${RUN_DIR:-./data/raw/_no_run}/flows/hosts:/out
  restart: "no"

# Each emulator replays its seeded benign plan from data/raw/<run_id>/benign_plan/, which
# `make up` writes from testbed/profiles/benign.yaml (E1-05). No restart: a restarted
# emulator would replay its plan from the start and break the same-seed guarantee.
x-emulator: &emulator
  image: eclipse-mosquitto:2.0.22
  depends_on: [broker, mqtt-logger]
  entrypoint: ["/bin/sh", "/emulator/emulate.sh"]
  volumes:
    - ./testbed/emulator:/emulator:ro
    - ${RUN_DIR:-./data/raw/_no_run}/benign_plan:/plan:ro
  restart: "no"

services:
  # Authenticated (ADR-0003, E1-05). Its connection log goes to mqtt/broker.log in the run.
  broker:
    image: eclipse-mosquitto:2.0.22
    entrypoint: ["/bin/sh", "/mosquitto/config/start.sh"]
    volumes:
      - ./testbed/broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./testbed/broker/start.sh:/mosquitto/config/start.sh:ro
      - ./testbed/broker/credentials.txt:/mosquitto/config/credentials.txt:ro
      - ${RUN_DIR:-./data/raw/_no_run}/mqtt:/mosquitto/log
    networks:
      testbed:
        ipv4_address: 10.77.0.2
    restart: unless-stopped

  # Flow capture (ADR-0009, amending ADR-0008's capture point). One sidecar per host that
  # sends traffic, in that host's network namespace, records only the packets the host sends
  # (`-Q out`), so every packet on the testbed network is captured once, at its sender.
  # `make down` merges flows/hosts/*.pcap into flows/raw.pcap (tcpslice), then NFStream
  # turns it into flows.jsonl. A host added to the testbed network needs its own sidecar
  # (tests/test_capture.py checks this).
  capture-broker:
    <<: *capture
    network_mode: "service:broker"
    depends_on: [broker]
    command: ["tcpdump", "-i", "eth0", "-Q", "out", "-s", "0", "-n", "-U", "-w", "/out/broker.pcap"]

  capture-mqtt-logger:
    <<: *capture
    network_mode: "service:mqtt-logger"
    depends_on: [mqtt-logger]
    command: ["tcpdump", "-i", "eth0", "-Q", "out", "-s", "0", "-n", "-U", "-w", "/out/mqtt-logger.pcap"]

  capture-honeypot:
    <<: *capture
    network_mode: "service:honeypot"
    depends_on: [honeypot]
    command: ["tcpdump", "-i", "eth0", "-Q", "out", "-s", "0", "-n", "-U", "-w", "/out/honeypot.pcap"]

  capture-emulator-temp:
    <<: *capture
    network_mode: "service:emulator-temp"
    depends_on: [emulator-temp]
    command: ["tcpdump", "-i", "eth0", "-Q", "out", "-s", "0", "-n", "-U", "-w", "/out/emulator-temp.pcap"]

  capture-emulator-cam:
    <<: *capture
    network_mode: "service:emulator-cam"
    depends_on: [emulator-cam]
    command: ["tcpdump", "-i", "eth0", "-Q", "out", "-s", "0", "-n", "-U", "-w", "/out/emulator-cam.pcap"]

  capture-emulator-hum:
    <<: *capture
    network_mode: "service:emulator-hum"
    depends_on: [emulator-hum]
    command: ["tcpdump", "-i", "eth0", "-Q", "out", "-s", "0", "-n", "-U", "-w", "/out/emulator-hum.pcap"]

  capture-emulator-plug:
    <<: *capture
    network_mode: "service:emulator-plug"
    depends_on: [emulator-plug]
    command: ["tcpdump", "-i", "eth0", "-Q", "out", "-s", "0", "-n", "-U", "-w", "/out/emulator-plug.pcap"]

  # Writes every MQTT message the broker carries to the raw MQTT file. Waits 5 s so its
  # capture sidecar is running before it opens its connection (ADR-0009). Emulators also
  # wait 5 s, then 10 s more before their first reading, so the logger subscribes first.
  mqtt-logger:
    image: eclipse-mosquitto:2.0.22
    depends_on: [broker]
    command: ["sh", "-c", "sleep 5; exec mosquitto_sub -h broker -i mqtt-logger -u mqtt-logger -P testbed-logger-pw -t '#' -F '%I %t %p' >> /out/mqtt.log"]
    volumes:
      - ${RUN_DIR:-./data/raw/_no_run}/mqtt:/out
    networks:
      testbed:
        ipv4_address: 10.77.0.4
    restart: unless-stopped

  honeypot:
    image: cowrie/cowrie:3.1.0
    environment:
      COWRIE_TELNET_ENABLED: "no"
    volumes:
      - ${RUN_DIR:-./data/raw/_no_run}/honeypot:/cowrie/cowrie-git/var/log/cowrie
    networks:
      testbed:
        ipv4_address: 10.77.0.10
    restart: unless-stopped

  emulator-temp:
    <<: *emulator
    environment: {DEVICE_ID: iot-temp-01, PASSWORD: testbed-temp-pw}
    networks:
      testbed:
        ipv4_address: 10.77.0.21

  emulator-cam:
    <<: *emulator
    environment: {DEVICE_ID: iot-cam-01, PASSWORD: testbed-cam-pw}
    networks:
      testbed:
        ipv4_address: 10.77.0.22

  emulator-hum:
    <<: *emulator
    environment: {DEVICE_ID: iot-hum-01, PASSWORD: testbed-hum-pw}
    networks:
      testbed:
        ipv4_address: 10.77.0.23

  emulator-plug:
    <<: *emulator
    environment: {DEVICE_ID: iot-plug-01, PASSWORD: testbed-plug-pw}
    networks:
      testbed:
        ipv4_address: 10.77.0.24

networks:
  testbed:
    internal: true
    ipam:
      config:
        - subnet: 10.77.0.0/24
