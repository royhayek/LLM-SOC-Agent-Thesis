# Testbed broker. Reachable only on the internal testbed network (record §6.11).
listener 1883
persistence false

# Authentication (ADR-0003, E1-05): every client logs in. testbed/broker/start.sh builds the
# hashed password file from testbed/broker/credentials.txt at start-up.
allow_anonymous false
password_file /tmp/passwd

# Connection log, kept with the run's MQTT telemetry (data/raw/<run_id>/mqtt/broker.log).
# It records connections, disconnections and refused logins, which mqtt.log cannot show.
log_dest file /mosquitto/log/broker.log
log_dest stdout
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true
