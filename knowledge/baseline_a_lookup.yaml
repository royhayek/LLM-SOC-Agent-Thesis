# Baseline A severity->action lookup v1.0 (ticket E8-01). Baseline A is the flow classifier
# (E4-02); on its own it cannot recommend, so this frozen lookup gives it a response, which makes
# H4's safety comparison well-posed (record risk #6, §6.6). Fixed BEFORE any agent or baseline
# output exists on corpus bundles, so it cannot be tuned to make the agent look better or worse.
# Frozen at git tag `baseline-a-lookup-v1.0`. Changes only through a METHODS.md changelog entry.
#
# Every mapping points to one action id from action catalog v0.1 (tag catalog-v0.1) and reuses a
# verified citation from knowledge/action_sets.yaml (tag action-sets-v1.0), whose quotes were
# matched to their sources by E0-04. No citation here is new. Each chosen (family, severity) action
# is `acceptable` for that family in the action sets; the mapping scales the response with severity
# rather than always picking the most cautious action (which would make Baseline A "safe" by
# construction). Source ids (A1, A3, A5, A7, AT, C1, N3, E1) are the action_catalog.yaml `sources`.

version: "1.0"
date: "2026-10-15"
catalog_version: "0.1"
action_sets_version: "1.0"

# Severity rule: Baseline A predicts one family and a class probability (the max softmax score,
# E4-02). Severity is a fixed function of that score, defined here and never tuned. Benign maps to
# no_action at every severity. Attack severities rise with the classifier's confidence.
severity_rule:
  score_field: "max class probability of the flow classifier (E4-02)"
  thresholds:        # severity = the highest band whose lower bound <= score
    low: 0.0
    medium: 0.5
    high: 0.7
    critical: 0.9

lookup:
  ssh_brute_force:
    low:      {action: monitor,             citation: {source: A7, locator: "p. 2"}}
    medium:   {action: escalate_to_analyst, citation: {source: N3, locator: "RS.MA-04 N1"}}
    high:     {action: block_source,        citation: {source: A5, locator: "Adopter les bons réflexes, p. 25"}}
    critical: {action: reset_credentials,   citation: {source: AT, locator: "M1036 Account Use Policies, on T1110 Brute Force"}}
  port_scan:
    low:      {action: monitor,             citation: {source: A3, locator: "Containment phase, p. 35"}}
    medium:   {action: escalate_to_analyst, citation: {source: N3, locator: "RS.MA-04 N1"}}
    high:     {action: block_source,        citation: {source: A5, locator: "Adopter les bons réflexes, p. 25"}}
    critical: {action: disable_service,     citation: {source: AT, locator: "M1042 Disable or Remove Feature or Program, on T1046 Network Service Discovery"}}
  mqtt_publish_flood:
    low:      {action: monitor,             citation: {source: A7, locator: "p. 2"}}
    medium:   {action: escalate_to_analyst, citation: {source: N3, locator: "RS.MA-04 N1"}}
    high:     {action: rate_limit_source,   citation: {source: A1, locator: "§3.2 Réaction face à une attaque, p. 29"}}
    critical: {action: isolate_device,      citation: {source: A3, locator: "Objectifs de l'endiguement, p. 34"}}
  mqtt_brute_force:
    low:      {action: monitor,             citation: {source: A7, locator: "p. 2"}}
    medium:   {action: escalate_to_analyst, citation: {source: N3, locator: "RS.MA-04 N1"}}
    high:     {action: reset_credentials,   citation: {source: AT, locator: "M1036 Account Use Policies, on T1110 Brute Force"}}
    critical: {action: isolate_device,      citation: {source: A3, locator: "Objectifs de l'endiguement, p. 34"}}
  syn_flood:
    low:      {action: monitor,             citation: {source: A7, locator: "p. 2"}}
    medium:   {action: escalate_to_analyst, citation: {source: N3, locator: "RS.MA-04 N1"}}
    high:     {action: rate_limit_source,   citation: {source: AT, locator: "M1037 Filter Network Traffic, on T1498 Network Denial of Service"}}
    critical: {action: block_source,        citation: {source: A1, locator: "§3.2 Réaction face à une attaque, p. 28"}}
  botnet:
    low:      {action: monitor,             citation: {source: A7, locator: "p. 2"}}
    medium:   {action: escalate_to_analyst, citation: {source: C1, locator: "§3 Réagir - Décider"}}
    high:     {action: block_source,        citation: {source: A5, locator: "Adopter les bons réflexes, p. 25"}}
    critical: {action: isolate_device,      citation: {source: A5, locator: "Adopter les bons réflexes, p. 24"}}
  benign:
    low:      {action: no_action, citation: {source: E1, locator: "§8.3, p. 46"}}
    medium:   {action: no_action, citation: {source: E1, locator: "§8.3, p. 46"}}
    high:     {action: no_action, citation: {source: E1, locator: "§8.3, p. 46"}}
    critical: {action: no_action, citation: {source: E1, locator: "§8.3, p. 46"}}
